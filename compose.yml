services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:latest
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - pdf-service
      - data-crossing
      - juntada-service
      - minutas-service

  pdf-service:
    build:
      context: ./pdf-service
      dockerfile: Dockerfile
    image: pdf-service:latest
    container_name: pdf-service
    ports:
      - "8000:8000"
    volumes:
      - ./pdf-service:/usr/src/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    working_dir: /usr/src/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Análise de conluio. Sem internet em produção: os pesos do OCR (docTR)
  # vêm embutidos na imagem; o Gemini é chamado pelo navegador.
  data-crossing:
    build:
      context: ./data-crossing
      dockerfile: Dockerfile
    image: data-crossing:latest
    container_name: data-crossing
    ports:
      - "8001:8001"
    volumes:
      - data-crossing-db:/app/data   # sessões e hashes dos relatórios (SQLite)
    environment:
      - LLM_THREADS=4
      - OCR_ATIVO=0
      # CPF(s) do usuário consultante do SICAF, vindos do ambiente do servidor
      # (dado pessoal: não versionar)
      - CPF_IGNORADOS=${CPF_IGNORADOS:-}
    restart: unless-stopped

  # Juntada de documentos: confere as certidões e monta o PDF para o SEI.
  juntada-service:
    build:
      context: ./juntada-service
      dockerfile: Dockerfile
    image: juntada-service:latest
    container_name: juntada-service
    ports:
      - "8002:8002"
    volumes:
      - juntada-sessoes:/app/data   # arquivos das sessões (apagados após 48 h)
    environment:
      - JUNTADA_CONSULTA_TCU=${JUNTADA_CONSULTA_TCU:-0}   # 1 só se a TI liberar saída para o TCU
    restart: unless-stopped

  # Minutas: aviso de dispensa e edital de pregão a partir dos modelos da AGU.
  # Os modelos (.docx) vêm na imagem; versões novas enviadas pela tela ficam no volume.
  minutas-service:
    build:
      context: ./minutas-service
      dockerfile: Dockerfile
    image: minutas-service:latest
    container_name: minutas-service
    ports:
      - "8003:8003"
    volumes:
      - minutas-modelos:/app/modelos
    restart: unless-stopped

volumes:
  data-crossing-db:
  juntada-sessoes:
  minutas-modelos:
